name: preset-factory

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

jobs:
  generate-and-filter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Stop if target already reached
        id: targetcheck
        run: |
          COUNT=$(find presets/accepted -type f -name '*.milk' | wc -l || true)
          echo "accepted_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Accepted count: $COUNT"
          if [ "$COUNT" -ge 500 ]; then
            echo "Target reached already."
          fi

      - name: Set up Node
        if: steps.targetcheck.outputs.accepted_count < 500
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pick next queued batch
        if: steps.targetcheck.outputs.accepted_count < 500
        id: batch
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('manifests/queue.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const batch = lines.find(x => x.status === 'queued');
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `batch_id=${batch ? batch.batch_id : ''}\n`);
          fs.appendFileSync(out, `family=${batch ? batch.family : ''}\n`);
          fs.appendFileSync(out, `count=${batch ? batch.count : ''}\n`);
          NODE

      - name: Stop if no queued batches remain
        if: steps.targetcheck.outputs.accepted_count < 500 && steps.batch.outputs.batch_id == ''
        run: echo "No queued batches."

      - name: Run Codex to generate batch
        if: steps.targetcheck.outputs.accepted_count < 500 && steps.batch.outputs.batch_id != ''
        uses: openai/codex-action@v1
        with:
          prompt: |
            Read AGENTS.md and prompts/codex/generate_batch.md.
            Generate ${{ steps.batch.outputs.count }} projectM-safe .milk presets for family=${{ steps.batch.outputs.family }}
            into presets/candidates/${{ steps.batch.outputs.batch_id }}/.
            Follow AGENTS.md constraints exactly.
            Use the style brief file prompts/style_briefs/${{ steps.batch.outputs.family }}.md.
            Do not modify presets/accepted/.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run lint/scoring/dedupe/selection
        if: steps.targetcheck.outputs.accepted_count < 500 && steps.batch.outputs.batch_id != ''
        run: |
          ./tools/batch_runner.sh "presets/candidates/${{ steps.batch.outputs.batch_id }}" "${{ steps.batch.outputs.family }}"

      - name: Mark batch done
        if: steps.targetcheck.outputs.accepted_count < 500 && steps.batch.outputs.batch_id != ''
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const target = "${{ steps.batch.outputs.batch_id }}";
          const rows = fs.readFileSync('manifests/queue.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          for (const r of rows) if (r.batch_id === target) r.status = 'done';
          fs.writeFileSync('manifests/queue.jsonl', rows.map(r => JSON.stringify(r)).join('\n') + '\n');
          NODE

      - name: Commit and push results
        if: steps.targetcheck.outputs.accepted_count < 500 && steps.batch.outputs.batch_id != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md prompts manifests tools presets package.json .github/workflows/preset-factory.yml
          git commit -m "Preset batch ${{ steps.batch.outputs.batch_id }}" || echo "No changes to commit"
          git push
