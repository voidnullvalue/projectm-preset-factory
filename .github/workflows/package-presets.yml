name: package-presets

on:
  workflow_dispatch:
  schedule:
    - cron: "45 * * * *"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count accepted presets
        id: count
        run: |
          COUNT=$(find presets/accepted -type f -name '*.milk' | wc -l || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Accepted count: $COUNT"

      - name: Stop if under 500
        if: steps.count.outputs.count < 500
        run: echo "Not enough accepted presets yet."

      - name: Create zip
        if: steps.count.outputs.count >= 500
        run: |
          mkdir -p dist
          cd presets/accepted
          zip -r ../../dist/projectm_presets_voidnullvalue_500pack.zip ./*.milk

      - name: Upload artifact
        if: steps.count.outputs.count >= 500
        uses: actions/upload-artifact@v4
        with:
          name: projectm-presets-500pack
          path: dist/projectm_presets_voidnullvalue_500pack.zip
